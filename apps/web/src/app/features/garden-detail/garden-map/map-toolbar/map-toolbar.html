<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Zoom out"
  i18n-aria-label
  title="Zoom out"
  i18n-title
  [disabled]="zoom() <= minZoom"
  (click)="zoomOut.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 11h14v2H5z" fill="currentColor" />
  </svg>
</button>
<span class="zoom-level tabular" aria-live="polite">{{ zoomPercent() }}%</span>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Zoom in"
  i18n-aria-label
  title="Zoom in"
  i18n-title
  [disabled]="zoom() >= maxZoom"
  (click)="zoomIn.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor" />
  </svg>
</button>
<span class="toolbar-divider" aria-hidden="true"></span>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Fit garden"
  i18n-aria-label
  title="Fit garden"
  i18n-title
  (click)="fit.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M4 9V5a1 1 0 0 1 1-1h4v2H6v3H4Zm16 0V6h-3V4h4a1 1 0 0 1 1 1v4h-2ZM4 15h2v3h3v2H5a1 1 0 0 1-1-1v-4Zm16 0h2v4a1 1 0 0 1-1 1h-4v-2h3v-3Z"
      fill="currentColor"
    />
  </svg>
</button>
<button
  class="tool-btn press-feedback tool-secondary"
  type="button"
  aria-label="Reset view and selection"
  i18n-aria-label
  title="Reset view and selection"
  i18n-title
  (click)="resetView.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="currentColor" />
  </svg>
</button>
<span class="toolbar-divider" aria-hidden="true"></span>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Undo layout move"
  i18n-aria-label
  title="Undo layout move"
  i18n-title
  [disabled]="!canUndo()"
  (click)="undo.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12.5 8H7.83l2.58-2.59L9 4 4 9l5 5 1.41-1.41L7.83 10h4.67a4.5 4.5 0 0 1 0 9H7v2h5.5a6.5 6.5 0 0 0 0-13Z"
      fill="currentColor"
    />
  </svg>
</button>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Redo layout move"
  i18n-aria-label
  title="Redo layout move"
  i18n-title
  [disabled]="!canRedo()"
  (click)="redo.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M11.5 8h4.67l-2.58-2.59L15 4l5 5-5 5-1.41-1.41L16.17 10H11.5a4.5 4.5 0 0 0 0 9H17v2h-5.5a6.5 6.5 0 0 1 0-13Z"
      fill="currentColor"
    />
  </svg>
</button>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Reset layout to automatic arrangement"
  i18n-aria-label
  title="Reset layout to automatic arrangement"
  i18n-title
  [disabled]="!hasCustomLayout()"
  (click)="resetLayout.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM17.5 13.6l1.4 1.4-2 2 2 2-1.4 1.4-2-2-2 2-1.4-1.4 2-2-2-2 1.4-1.4 2 2z"
      fill="currentColor"
    />
  </svg>
</button>
<span class="toolbar-divider" aria-hidden="true"></span>
<button
  class="tool-btn press-feedback"
  type="button"
  [attr.aria-label]="timelineLabel()"
  [attr.title]="timelineLabel()"
  [attr.aria-pressed]="timelineOpen()"
  [disabled]="!canReplay()"
  (click)="toggleTimeline.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.64 2.64A8.97 8.97 0 0 0 12 3Zm-1 4v6l5 3 .9-1.5-3.9-2.3V7h-2Z"
      fill="currentColor"
    />
  </svg>
</button>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Toggle layers menu"
  i18n-aria-label
  title="Toggle layers menu"
  i18n-title
  [attr.aria-expanded]="layersOpen()"
  (click)="toggleLayers.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="m12 3 9 5-9 5-9-5 9-5Zm-6.7 8.1L12 14.8l6.7-3.7L21 12.4l-9 5-9-5 2.3-1.3Zm0 4L12 18.8l6.7-3.7L21 16.4l-9 5-9-5 2.3-1.3Z"
      fill="currentColor"
    />
  </svg>
</button>
<button
  class="tool-btn press-feedback"
  type="button"
  aria-label="Show the plan as a list"
  i18n-aria-label
  title="Show the plan as a list"
  i18n-title
  [attr.aria-pressed]="listOpen()"
  (click)="toggleList.emit()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M4 5.5h2.5V8H4V5.5Zm5 0h11V8H9V5.5ZM4 10.75h2.5v2.5H4v-2.5Zm5 0h11v2.5H9v-2.5ZM4 16h2.5v2.5H4V16Zm5 0h11v2.5H9V16Z"
      fill="currentColor"
    />
  </svg>
</button>
<button
  class="tool-btn press-feedback"
  type="button"
  [attr.aria-label]="fullscreenLabel()"
  [attr.title]="fullscreenLabel()"
  (click)="toggleFullscreen.emit()"
>
  @if (isFullscreen()) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M9 4v3H6v2h5V4H9Zm9 5V7h-3V4h-2v5h5ZM4 15v2h3v3h2v-5H4Zm11 5h2v-3h3v-2h-5v5Z"
        fill="currentColor"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M4 4h6v2H6v4H4V4Zm10 0h6v6h-2V6h-4V4ZM4 14h2v4h4v2H4v-6Zm14 0h2v6h-6v-2h4v-4Z"
        fill="currentColor"
      />
    </svg>
  }
</button>
