<label class="layer-toggle">
  <input type="checkbox" [checked]="layers().labels" (change)="toggleLayer.emit('labels')" />
  <ng-container i18n>Plant labels</ng-container>
</label>
<label class="layer-toggle">
  <input
    type="checkbox"
    [checked]="layers().footprints"
    (change)="toggleLayer.emit('footprints')"
  />
  <ng-container i18n>Footprints</ng-container>
</label>
<label class="layer-toggle">
  <input type="checkbox" [checked]="layers().grid" (change)="toggleLayer.emit('grid')" />
  <ng-container i18n>Grid</ng-container>
</label>
<label class="layer-toggle">
  <input type="checkbox" [checked]="layers().humidity" (change)="toggleLayer.emit('humidity')" />
  <ng-container i18n>Humidity preference</ng-container>
</label>
<label class="layer-toggle">
  <input type="checkbox" [checked]="layers().zones" (change)="toggleLayer.emit('zones')" />
  <ng-container i18n>Watering zones</ng-container>
</label>
<label class="layer-toggle">
  <input type="checkbox" [checked]="layers().freeSpace" (change)="toggleLayer.emit('freeSpace')" />
  <ng-container i18n>Available space</ng-container>
</label>
@if (layers().zones) {
  <ul class="zone-legend">
    @for (z of zoneLegend; track z.zone) {
      <li>
        <span class="zone-swatch" [attr.data-zone]="z.zone" aria-hidden="true"></span>
        {{ z.label }} <span class="zone-range">{{ z.range }}</span>
      </li>
    }
    <li class="zone-clash-key">
      <span class="clash-swatch" aria-hidden="true">≠</span>
      <ng-container i18n>Neighbours that need different watering</ng-container>
    </li>
  </ul>
}
@if (layers().humidity || layers().zones) {
  <p class="layers-note" i18n>Preference vs target — not a measurement</p>
}
