<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HomeGarden</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Automated garden management — gardens, plants and humidity at a glance."
    />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- The two latin variable fonts (UI and display), requested with the
         page instead of after the stylesheet has been parsed. Media files
         keep their names (outputHashing: bundles), so the URL is stable and
         the same one the stylesheet asks for. -->
    <link
      rel="preload"
      href="media/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="media/sora-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
