# Angular 22 requires Node ^22.22.3 || ^24.15.0 || >=26 (see package.json engines).
image: node:22

variables:
  CI: 'true'

# Nx Cloud is deliberately disabled for this repository (nx.json:
# "neverConnectToCloud": true), so no task distribution or run recording here.
CI:
  interruptible: true
  only:
    - main
    - merge_requests
  script:
    - npm ci
    - npx nx run-many -t lint typecheck test build
    - npm run check:no-spinners
